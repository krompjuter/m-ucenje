<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Srpski jezik za V razred</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #1a2a1a 0%, #162616 50%, #0f3a0f 100%);
  min-height: 100vh;
  padding: 16px;
}

.app {
  max-width: 980px;
  margin: 0 auto;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.4);
  overflow: hidden;
  min-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
}

/* ─── Header ─── */
.header {
  background: linear-gradient(135deg, #1a6b3a, #38c96a);
  padding: 20px 28px 14px;
  color: white;
  text-align: center;
}
.header h1 { font-size: 1.8em; letter-spacing: 0.5px; }
.header p  { margin-top: 3px; opacity: 0.85; font-size: 0.95em; }

.global-score {
  display: flex;
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
  margin-top: 12px;
  overflow: hidden;
}
.global-score div {
  flex: 1; text-align: center; color: white;
  font-size: 0.8em; font-weight: 600; padding: 7px 4px;
}
.global-score span { font-size: 1.4em; display: block; line-height: 1.2; }

/* ─── Tabs ─── */
.tabs {
  display: flex;
  background: #f4f6f8;
  border-bottom: 2px solid #e2e8f0;
}
.tab-btn {
  flex: 1; padding: 13px 5px;
  border: none; background: transparent; cursor: pointer;
  font-size: 0.88em; font-weight: 700; color: #718096;
  border-bottom: 3px solid transparent; margin-bottom: -2px;
  transition: all 0.22s;
}
.tab-btn:hover { background: #edf2f7; color: #1a6b3a; }
.tab-btn.active { color: #1a6b3a; border-bottom-color: #1a6b3a; background: white; }

/* ─── Content ─── */
.content { padding: 24px 28px 40px; flex: 1; }
.section { display: none; }
.section.active { display: block; }

/* ─── Mini scores ─── */
.mini-scores { display: flex; gap: 12px; margin-bottom: 16px; }
.score-card { flex: 1; padding: 10px 12px; border-radius: 12px; text-align: center; color: white; }
.score-card.c { background: linear-gradient(135deg, #1a6b3a, #38c96a); }
.score-card.w { background: linear-gradient(135deg, #f7971e, #ffd200); color: #333; }
.score-card .num { font-size: 1.9em; font-weight: 700; line-height: 1; }
.score-card .lbl { font-size: 0.73em; margin-top: 2px; }

/* ─── Problem card ─── */
.problem-card {
  background: linear-gradient(145deg, #f6fff8, #edfff2);
  border: 2px solid #b2f5c8; border-radius: 16px;
  padding: 26px 20px 20px; text-align: center; margin-bottom: 14px;
}
.problem-text {
  font-size: 1.4em; color: #1a202c; min-height: 44px;
  margin-bottom: 8px; font-weight: 600; letter-spacing: 0.2px;
  line-height: 1.6;
}
.problem-text b {
  color: #1a6b3a;
  border-bottom: 2.5px solid #1a6b3a;
  padding-bottom: 1px;
}
.question-text {
  font-size: 0.93em; color: #4a5568; font-weight: 700;
  margin-bottom: 18px; letter-spacing: 0.2px;
}

/* ─── Options grid ─── */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 560px;
  margin: 0 auto 12px;
}
.opt-btn {
  padding: 13px 10px;
  border: 2.5px solid #cbd5e0; border-radius: 12px;
  background: white; color: #2d3748;
  font-size: 0.95em; font-weight: 700;
  cursor: pointer; transition: all 0.18s;
  line-height: 1.3;
}
.opt-btn:hover:not(:disabled) {
  border-color: #1a6b3a; background: #f0fff4; color: #1a6b3a;
  transform: translateY(-1px);
}
.opt-btn.correct { background: #c6f6d5; border-color: #38a169; color: #22543d; }
.opt-btn.wrong   { background: #fed7d7; border-color: #e53e3e; color: #742a2a; }
.opt-btn:disabled { cursor: default; transform: none; }

/* ─── Feedback ─── */
.feedback {
  margin-top: 13px; padding: 10px 16px; border-radius: 10px;
  font-size: 0.97em; font-weight: 600; display: none; text-align: center;
}
.feedback.ok  { background: #c6f6d5; color: #22543d; display: block; border: 1.5px solid #9ae6b4; }
.feedback.err { background: #fed7d7; color: #742a2a; display: block; border: 1.5px solid #fc8181; }

/* ─── Buttons ─── */
.btn-row { display: flex; gap: 11px; justify-content: center; }
.btn {
  padding: 11px 26px; border: none; border-radius: 11px;
  font-size: 0.97em; font-weight: 700; cursor: pointer;
  transition: all 0.2s; letter-spacing: 0.3px;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 16px rgba(0,0,0,0.18); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-new { background: linear-gradient(135deg, #1a6b3a, #38c96a); color: white; }

/* ─── Confetti ─── */
#confetti-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 9999; display: none;
}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="app">

  <!-- Header -->
  <div class="header">
    <h1>📖 Srpski jezik za V razred</h1>
    <p>Padeži &nbsp;·&nbsp; Vrsta reči &nbsp;·&nbsp; Služba reči</p>
    <p id="header-quote" style="margin-top:10px;font-size:0.72em;opacity:0.82;font-style:italic;line-height:1.5;max-width:580px;margin-left:auto;margin-right:auto;"></p>
    <div class="global-score">
      <div><span id="g-ok">0</span>✅ Tačno</div>
      <div><span id="g-wr">0</span>❌ Netačno</div>
      <div><span id="g-pct">—</span>Uspešnost</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(this,'padezi')">🗂️ Padeži</button>
    <button class="tab-btn" onclick="switchTab(this,'vrsta')">📝 Vrsta reči</button>
    <button class="tab-btn" onclick="switchTab(this,'sluzba')">⚙️ Služba reči</button>
  </div>

  <div class="content">

    <!-- ===== PADEŽI ===== -->
    <div id="padezi" class="section active">
      <div class="mini-scores">
        <div class="score-card c"><div class="num" id="p-ok">0</div><div class="lbl">Tačno</div></div>
        <div class="score-card w"><div class="num" id="p-wr">0</div><div class="lbl">Netačno</div></div>
      </div>
      <div class="problem-card">
        <div class="problem-text" id="p-sent"></div>
        <div class="question-text" id="p-q"></div>
        <div class="options-grid" id="p-opts"></div>
        <div class="feedback" id="p-fb"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-new" id="p-next" onclick="newQ('p')" disabled>Sledeće pitanje 🔄</button>
      </div>
    </div>

    <!-- ===== VRSTA REČI ===== -->
    <div id="vrsta" class="section">
      <div class="mini-scores">
        <div class="score-card c"><div class="num" id="v-ok">0</div><div class="lbl">Tačno</div></div>
        <div class="score-card w"><div class="num" id="v-wr">0</div><div class="lbl">Netačno</div></div>
      </div>
      <div class="problem-card">
        <div class="problem-text" id="v-sent"></div>
        <div class="question-text" id="v-q"></div>
        <div class="options-grid" id="v-opts"></div>
        <div class="feedback" id="v-fb"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-new" id="v-next" onclick="newQ('v')" disabled>Sledeće pitanje 🔄</button>
      </div>
    </div>

    <!-- ===== SLUŽBA REČI ===== -->
    <div id="sluzba" class="section">
      <div class="mini-scores">
        <div class="score-card c"><div class="num" id="s-ok">0</div><div class="lbl">Tačno</div></div>
        <div class="score-card w"><div class="num" id="s-wr">0</div><div class="lbl">Netačno</div></div>
      </div>
      <div class="problem-card">
        <div class="problem-text" id="s-sent"></div>
        <div class="question-text" id="s-q"></div>
        <div class="options-grid" id="s-opts"></div>
        <div class="feedback" id="s-fb"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-new" id="s-next" onclick="newQ('s')" disabled>Sledeće pitanje 🔄</button>
      </div>
    </div>

  </div>
</div>

<script>
// ============================================================
// Question banks — 10 per topic
// ============================================================
const QS = {
  p: [
    { sent: '<b>Dečak</b> trči po parku.',         q: 'U kom padežu je podvučena reč?', ans: 'Nominativ',    opts: ['Nominativ','Genitiv','Akuzativ','Dativ'] },
    { sent: 'Nema <b>vode</b> u čaši.',             q: 'U kom padežu je podvučena reč?', ans: 'Genitiv',      opts: ['Nominativ','Genitiv','Dativ','Lokativ'] },
    { sent: 'Dajem <b>sestri</b> poklon.',          q: 'U kom padežu je podvučena reč?', ans: 'Dativ',        opts: ['Dativ','Akuzativ','Genitiv','Instrumental'] },
    { sent: 'Vidim <b>psa</b> na ulici.',           q: 'U kom padežu je podvučena reč?', ans: 'Akuzativ',     opts: ['Akuzativ','Nominativ','Genitiv','Dativ'] },
    { sent: '<b>Petru</b>, dođi ovamo!',            q: 'U kom padežu je podvučena reč?', ans: 'Vokativ',      opts: ['Vokativ','Nominativ','Dativ','Lokativ'] },
    { sent: 'Pišem <b>olovkom</b>.',                q: 'U kom padežu je podvučena reč?', ans: 'Instrumental', opts: ['Instrumental','Dativ','Akuzativ','Lokativ'] },
    { sent: 'Pričamo o <b>školi</b>.',              q: 'U kom padežu je podvučena reč?', ans: 'Lokativ',      opts: ['Lokativ','Dativ','Genitiv','Akuzativ'] },
    { sent: 'Skok <b>tigra</b> je impresivan.',     q: 'U kom padežu je podvučena reč?', ans: 'Genitiv',      opts: ['Genitiv','Nominativ','Akuzativ','Instrumental'] },
    { sent: 'Idem u <b>grad</b>.',                  q: 'U kom padežu je podvučena reč?', ans: 'Akuzativ',     opts: ['Akuzativ','Nominativ','Lokativ','Dativ'] },
    { sent: 'Sedim na <b>klupi</b>.',               q: 'U kom padežu je podvučena reč?', ans: 'Lokativ',      opts: ['Lokativ','Dativ','Instrumental','Akuzativ'] }
  ],
  v: [
    { sent: '"trčati"', q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Glagol',    opts: ['Glagol','Imenica','Pridev','Prilog'] },
    { sent: '"brzo"',   q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Prilog',    opts: ['Prilog','Pridev','Glagol','Imenica'] },
    { sent: '"lep"',    q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Pridev',    opts: ['Pridev','Imenica','Prilog','Glagol'] },
    { sent: '"on"',     q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Zamenica',  opts: ['Zamenica','Imenica','Pridev','Veznik'] },
    { sent: '"škola"',  q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Imenica',   opts: ['Imenica','Pridev','Glagol','Prilog'] },
    { sent: '"pet"',    q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Broj',      opts: ['Broj','Imenica','Prilog','Pridev'] },
    { sent: '"i"',      q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Veznik',    opts: ['Veznik','Predlog','Rečca','Uzvik'] },
    { sent: '"na"',     q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Predlog',   opts: ['Predlog','Veznik','Prilog','Rečca'] },
    { sent: '"oh"',     q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Uzvik',     opts: ['Uzvik','Rečca','Predlog','Veznik'] },
    { sent: '"baš"',    q: 'Kojoj vrsti reči pripada ova reč?', ans: 'Rečca',     opts: ['Rečca','Uzvik','Predlog','Veznik'] }
  ],
  s: [
    { sent: '<b>Marko</b> čita knjigu.',        q: 'Koja je služba podvučene reči u rečenici?', ans: 'Subjekat',           opts: ['Subjekat','Predikat','Objekat','Atribut'] },
    { sent: 'Ana <b>piše</b> pismo.',           q: 'Koja je služba podvučene reči u rečenici?', ans: 'Predikat',           opts: ['Predikat','Subjekat','Objekat','Priloška odredba'] },
    { sent: 'Vidim <b>auto</b>.',               q: 'Koja je služba podvučene reči u rečenici?', ans: 'Objekat',            opts: ['Objekat','Subjekat','Predikat','Atribut'] },
    { sent: '<b>Crvena</b> ruža cveta.',        q: 'Koja je služba podvučene reči u rečenici?', ans: 'Atribut',            opts: ['Atribut','Subjekat','Priloška odredba','Objekat'] },
    { sent: '<b>Jutros</b> smo stigli.',        q: 'Koja je služba podvučene reči u rečenici?', ans: 'Priloška odredba',  opts: ['Priloška odredba','Atribut','Subjekat','Objekat'] },
    { sent: 'Dete se igra <b>u parku</b>.',     q: 'Koja je služba podvučene reči u rečenici?', ans: 'Priloška odredba',  opts: ['Priloška odredba','Objekat','Atribut','Predikat'] },
    { sent: 'On govori <b>glasno</b>.',         q: 'Koja je služba podvučene reči u rečenici?', ans: 'Priloška odredba',  opts: ['Priloška odredba','Atribut','Objekat','Predikat'] },
    { sent: '<b>Mačka</b> sedi na krevetu.',    q: 'Koja je služba podvučene reči u rečenici?', ans: 'Subjekat',           opts: ['Subjekat','Predikat','Objekat','Priloška odredba'] },
    { sent: 'Ona kuva <b>večeru</b>.',          q: 'Koja je služba podvučene reči u rečenici?', ans: 'Objekat',            opts: ['Objekat','Subjekat','Predikat','Atribut'] },
    { sent: '<b>Mali</b> dečak trči.',          q: 'Koja je služba podvučene reči u rečenici?', ans: 'Atribut',            opts: ['Atribut','Subjekat','Priloška odredba','Objekat'] }
  ]
};

// ============================================================
// State
// ============================================================
const S = {
  ok: 0, wr: 0,
  p: { ok: 0, wr: 0, idx: -1 },
  v: { ok: 0, wr: 0, idx: -1 },
  s: { ok: 0, wr: 0, idx: -1 }
};

function ri(max) { return Math.floor(Math.random() * max); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = ri(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// Tabs
// ============================================================
function switchTab(btn, tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tab).classList.add('active');
}

// ============================================================
// Global score
// ============================================================
function updateGlobal() {
  document.getElementById('g-ok').textContent = S.ok;
  document.getElementById('g-wr').textContent = S.wr;
  const t = S.ok + S.wr;
  document.getElementById('g-pct').textContent = t ? Math.round(S.ok / t * 100) + '%' : '—';
}

// ============================================================
// Render a new question for the given prefix
// ============================================================
function newQ(pfx) {
  const st   = S[pfx];
  const pool = QS[pfx];

  let idx;
  do { idx = ri(pool.length); } while (idx === st.idx && pool.length > 1);
  st.idx = idx;

  const q = pool[idx];
  document.getElementById(pfx + '-sent').innerHTML  = q.sent;
  document.getElementById(pfx + '-q').textContent   = q.q;
  document.getElementById(pfx + '-fb').className    = 'feedback';
  document.getElementById(pfx + '-next').disabled   = true;

  const opts = shuffle(q.opts);
  document.getElementById(pfx + '-opts').innerHTML = opts.map(o =>
    `<button class="opt-btn" data-val="${o.replace(/"/g, '&quot;')}" onclick="checkOpt(this,'${pfx}')">${o}</button>`
  ).join('');
}

// ============================================================
// Check selected option
// ============================================================
function checkOpt(btn, pfx) {
  const st       = S[pfx];
  const q        = QS[pfx][st.idx];
  const selected = btn.getAttribute('data-val');
  const correct  = selected === q.ans;

  document.querySelectorAll('#' + pfx + '-opts .opt-btn').forEach(b => {
    b.disabled = true;
    const val = b.getAttribute('data-val');
    if (val === q.ans)                  b.classList.add('correct');
    else if (val === selected)          b.classList.add('wrong');
  });

  const fb = document.getElementById(pfx + '-fb');
  if (correct) {
    st.ok++; S.ok++;
    document.getElementById(pfx + '-ok').textContent = st.ok;
    fb.className  = 'feedback ok';
    fb.textContent = '🎉 Odlično! Tačno!';
    if ((st.ok + st.wr) % 5 === 0) launchConfetti(100);
  } else {
    st.wr++; S.wr++;
    document.getElementById(pfx + '-wr').textContent = st.wr;
    fb.className  = 'feedback err';
    fb.textContent = `❌ Nije tačno. Tačan odgovor: ${q.ans}`;
  }

  updateGlobal();
  document.getElementById(pfx + '-next').disabled = false;
}

// ============================================================
// Confetti
// ============================================================
function launchConfetti(count) {
  const canvas = document.getElementById('confetti-canvas');
  const ctx    = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';

  const colors = ['#1a6b3a','#38c96a','#4776E6','#ffd200','#ff6b6b','#f7971e','#fff','#b2f5c8'];
  const pieces = Array.from({ length: count }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height * 0.5 - 20,
    w: Math.random() * 11 + 5, h: Math.random() * 6 + 3,
    color:    colors[Math.floor(Math.random() * colors.length)],
    rotation: Math.random() * Math.PI * 2,
    speed:    Math.random() * 3.5 + 1.5,
    drift:    Math.random() * 2 - 1,
    spin:     (Math.random() - 0.5) * 0.18,
    opacity:  1
  }));

  let frame = 0;
  const totalFrames = 280;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.speed; p.x += p.drift; p.rotation += p.spin;
      if (frame > totalFrames * 0.7)
        p.opacity = Math.max(0, 1 - (frame - totalFrames * 0.7) / (totalFrames * 0.3));
      ctx.save(); ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < totalFrames) requestAnimationFrame(draw);
    else { canvas.style.display = 'none'; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  draw();
}

// ============================================================
// Quotes
// ============================================================
const QUOTES = [
  { text: 'Jezik je odelo misli.',                                        author: 'Samuel Džonson' },
  { text: 'Granice mog jezika su granice mog sveta.',                     author: 'Ludvig Vitgenštajn' },
  { text: 'Ko zna više jezika, više vredi.',                              author: 'Narodna mudrost' },
  { text: 'Reč je seme, a um je zemlja u kojoj seme klija.',              author: 'Anonimni' },
  { text: 'Jezik je moćnije oružje od mača.',                             author: 'Anonimni' },
  { text: 'Čitanjem se otvara put ka znanju.',                            author: 'Anonimni' },
  { text: 'Jedna reč na pravo mesto vredna je hiljadu reči na krivo.',    author: 'Narodna mudrost' }
];

const hq = QUOTES[ri(QUOTES.length)];
document.getElementById('header-quote').textContent = `„${hq.text}" — ${hq.author}`;

// Init first questions
newQ('p');
newQ('v');
newQ('s');
</script>
</body>
</html>
